:root{--bg:#faf6ee;--card:#fff;--ink:#2a2220;--mut:#7a6d66;--acc:#6b1f2a;--gold:#b8892f;--red:#b3261e;--line:#e6dccb;--fs:19px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1615;--card:#262020;--ink:#efe6dc;--mut:#a79a90;--acc:#e0a3ab;--gold:#d9ad5c;--red:#ff8a80;--line:#3a312f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1615;--card:#262020;--ink:#efe6dc;--mut:#a79a90;--acc:#e0a3ab;--gold:#d9ad5c;--red:#ff8a80;--line:#3a312f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 "Zakon",Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--acc);color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--acc);z-index:10}
header h1{font-size:1rem;margin:0;flex:1;font-weight:600;line-height:1.2}
header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;min-width:40px;height:40px;font:inherit;font-size:.95rem;cursor:pointer}
nav{display:flex;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:11px 4px;font:inherit;font-size:.85rem;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--gold);font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px}
.date{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:2.6rem;line-height:1;color:var(--acc);font-weight:700}
.dm{font-size:1.05rem}.wd{color:var(--mut);font-size:.9rem}
.red .big{color:var(--red)}
h2{font-size:1.2rem;margin:12px 0 6px;color:var(--acc);line-height:1.3}
.lab{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:16px 0 4px;font-family:'Zakon',system-ui,sans-serif;font-weight:700}
p{margin:8px 0}.card b{font-weight:700}.card i{font-style:italic}.card s,.row s{text-decoration:none;color:var(--red)}.r{padding:8px 10px;border-left:3px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;margin:6px 0}
.note{color:var(--mut);font-size:.92em}
.step{display:flex;gap:8px;margin:12px 0}.step button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.row{display:flex;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.row b{min-width:2.1em;text-align:right;color:var(--acc)}.row.red b{color:var(--red)}
.row span{flex:1;font-size:.92rem;line-height:1.35}.row small{color:var(--mut);font-family:'Zakon',system-ui,sans-serif;font-size:.72rem}
.months{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.months button{padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:.85rem;cursor:pointer}
.months button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
input[type=search],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
mark{background:#ffe08a;color:#222;border-radius:3px}.hint{color:var(--mut);font-size:.85rem;margin:8px 2px}
</style>

 (бл. 262). Прп. Миколая, ченця (ІХ). <b>Прп. Кукші Одеського (1964).<\/b>","<b>Літургія за чином свт. Василія Великого.<\/b>"],"r":["<i>На 1-му часі: Євр., 303 зач., I, 1 – 12. Мф., 2 зач., I, 18 – 25.<\/i>","<i>На 3-му часі: Гал., 208 зач., III, 23 – 29. Лк., 5 зач., II, 1 – 20.<\/i>","<i>На 6-му часі: Євр., 304 зач., I, 10 – II, 3. Мф., 3 зач., II, 1 – 12.<\/i>","<i>На 9-му часі: Євр., 306 зач., II, 11 – 18. Мф., 4 зач., II, 13 – 23.<\/i>","<i>Літ. – Євр., 303 зач., I, 1 – 12. Лк., 5 зач., II, 1 – 20.<\/i>"],"n":["У цей день 1-й час до ранньої не приєднується, а звершуються окремо царські часи та зображальні. Блаженні читаються. <b>Літургія починається з вечірні<\/b><i>. <\/i>«Блажен муж» не співається. Вхід з Євангелієм, читання восьми паремій. Після 3-ї та 6-ї паремії відчиняються царські врата і співаються заспіви «З ними ж помилуй нас» та «Життєдавче, слава Тобі». Замість «Достойно» – «Тобою радується…». Причасний: «Хваліть Господа з небес…». Після відпусту Літургії чин славлення, клірики перед іконою і свічником з запаленою свічкою співають тропар і кондак свята Різдва Христового."]},{"m":12,"d":25,"x":1,"h":["<b><s>РІЗДВО ГОСПОДА БОГА І СПАСИТЕЛЯ НАШОГО ІСУСА ХРИСТА. Літургія за чином свт. Іоана Золотоустого.<\/s><\/b>"],"r":["<i><s>Ран. – Мф., 2 зач., I, 18 – 25.<\/s><\/i>","<i><s>Літ. – Гал., 209 зач., IV, 4 – 7. Мф., 3 зач., II, 1 – 12.<\/s><\/i>"],"n":["<s>Від 25 грудня до 4 січня – святки (святі дні). Немає посту в середу і п’ятницю. <\/s><b><s>Всенічна <\/s><\/b><s>починається з виголосу: «Слава Святій, Єдиносущній, Животворчій і Нероздільній Тройці завжди, нині і повсякчас, і на віки віків». На <\/s><b><s>ранній <\/s><\/b><s>величання: «Величаємо Тебе, Життєдавче Христе, що заради нас нині плоттю народився від Безневісної і Пречистої Діви Марії». Приспів на 9-й пісні канону: «Величай, душе моя, чеснішу і славнішу від горніх воїнств Діву Пречисту Богородицю». На <\/s><b><s>Літургії <\/s><\/b><s>– антифони свята, <\/s><b><s>вхідний стих: «Із утроби раніше віків Я породив Тебе. Клявся Господь і не розкається: “Ти священник повік за чином Мелхиседековим”»<\/s><\/b><s>. Замість трисвятого – «Всі ви, що в Христа хрестилися...». Замість «Достойно є…» – «Величай, душе моя...», «Таїнство дивне бачу і преславне...» (до віддання). В седмичні дні та на архієрейських службах після малого входу «Прийдіть, поклонімось... спаси нас, Сину Божий, що від Діви народився...» (до віддання). До віддання в седмичні дні відпуст святковий, а в недільні – воскресний.<\/s>","<s>На <\/s><b><s>вечірні <\/s><\/b><s>в день свята Різдва Христового вхід і великий прокимен «Хто Бог великий…».<\/s>"]},{"m":12,"d":26,"x":1,"h":["<b><s>Субота після Різдва Христового. <\/s><\/b><s>Післясвято Різдва Христового. <\/s><b><s>Собор Пресвятої Богородицi. <\/s><\/b><s>Сщмч. Євфимія, єп. Сардійського (бл. 840). Прп. Костянтина Синадського (VІІІ). Прп. Евареста Студита (825).<\/s>","<s>Віленсько-Остробрамських, названих «Трьох радостей» та «Милостива» ікон Божої Матері.<\/s>"],"r":["<i><s>Суботи після Різдва Христового: 1 Тим., 288 зач., VI, 11 – 16. Мф., 46 зач. (від половини), XII, 15 – 21.<\/s><\/i>","<i><s>Богородиці: Євр., 306 зач., II, 11 – 18. Мф., 4 зач., II, 13 – 23.<\/s><\/i>"],"n":["<s>На <\/s><b><s>вечірні <\/s><\/b><s>вхід, прокимен великий «Хто бог великий...». Замість «Чеснішу» співаються приспіви свята. Співається велике славослів’я.<\/s>"]},{"m":12,"d":27,"x":1,"h":["<b><s>30-та неділя після П’ятдесятниці, після Різдва Христового. Глас 5-й.<\/s><\/b>","<b><s>Прав. Йосифа Обручника, Давида, царя, і Якова, брата Господнього. <\/s><\/b><i><s>(перехідне святкування у неділю після Різдва Христового). <\/s><\/i><b><s>Ап. першомч. та архідиякона Стефана (34). <\/s><\/b><s>Прп. Федора Накресленого, спов. (бл. 840). Свт. Федора, архієп. Константинопольського (бл. 686). <\/s><b><s>Прп. Воніфатія, ігум. Феофаніївського (1871).<\/s><\/b>"],"r":["<i><s>Ран. – Єв. 8-е, Ін., 64 зач., XX, 11 – 18.<\/s><\/i>","<i><s>Літ. – неділі після Різдва Христового: Гал let fs=+(sg('fs')||19);document.documentElement.style.setProperty('--fs',fs+'px');
function size(n){fs=Math.min(26,Math.max(14,fs+n));document.documentElement.style.setProperty('--fs',fs+'px');ss('fs',fs)}
fm.onclick=()=>size(-1);fp.onclick=()=>size(1);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const wdOf=e=>new Date(2026,e.m-1,e.d).getDay();
function dayView(){const e=D[cur],w=wdOf(e);
return`<div class="card ${e.x?'red':''}"><div class="date"><span class="big">${e.d}</span><span class="dm">${MN[e.m-1]} 2026</span><span class="wd">${WD[w]}</span></div>
${e.h.map(x=>`<p>${x}</p>`).join('')}
<div class="lab">Читання</div>${e.r.map(x=>`<div class="r">${x}</div>`).join('')}
${e.n.length?`<div class="lab">Уставні примітки</div>${e.n.map(x=>`<p class="note">${x}</p>`).join('')}`:''}</div>
<div class="step"><button id="pv">← Попередній</button><button id="td">Сьогодні</button><button id="nx">Наступний →</button></div>
<input type="date" id="dp" min="2026-11-24" max="2026-12-31" value="2026-${String(e.m).padStart(2,'0')}-${String(e.d).padStart(2,'0')}" aria-label="Обрати дату">
<p class="hint">Червоним виділено неділі та свята, як у друкованому виданні. Дні можна гортати пальцем вліво чи вправо.</p>`}
function monthView(){return`<div class="months">${MI.map((n,i)=>D.some(e=>e.m===i+1)?`<button data-m="${i+1}" class="${mon===i+1?'on':''}">${n}</button>`:'').join('')}</div>`+
D.filter(e=>e.m===mon).map(e=>{const w=wdOf(e);const s=e.s.slice(0,150);return`<div class="row ${e.x?'red':''}" data-i="${D.indexOf(e)}"><b>${e.d}</b><span>${esc(s)}${s.length>=150?'…':''}</span><small>${WD[w].slice(0,2)}</small></div>`}).join('')}
function searchView(){return`<input type="search" id="q" placeholder="Свято, святий, місце читання…" value="${esc(q)}"><div id="res"></div>`}
function runSearch(){const el=document.getElementById('res');const s=q.trim().toLowerCase();if(s.length<3){el.innerHTML='<p class="hint">Введіть щонайменше 3 літери.</p>';return}
const hit=[];for(let i=0;i<D.length&&hit.length<60;i++){const e=D[i],t=e.s.toLowerCase(),p=t.indexOf(s);if(p>=0)hit.push([i,t,p])}
el.innerHTML=hit.length?hit.map(([i,t,p])=>{const e=D[i],a=Math.max(0,p-40),raw=e.s.slice(a,p+s.length+60);
const hl=esc(raw).replace(new RegExp(esc(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
return`<div class="row" data-i="${i}"><b>${e.d}</b><span>${hl}</span><small>${MN[e.m-1].slice(0,3)}</small></div>`}).join('')+(hit.length>=60?'<p class="hint">Показано перші 60 збігів.</p>':''):'<p class="hint">Нічого не знайдено.</p>'}
function go(i){cur=Math.max(0,Math.min(D.length-1,i));view='day';mon=D[cur].m;render();window.scrollTo(0,0);try{history.replaceState(null,'','#d-'+String(D[cur].m).padStart(2,'0')+'-'+String(D[cur].d).padStart(2,'0'))}catch(e){}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
app.innerHTML=view==='day'?dayView():view==='month'?monthView():searchView();
if(view==='day'){pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);td.onclick=today;dp.onchange=()=>{const[m,d]=dp.value.split('-').slice(1).map(Number);if(m)go(idx(m,d))}}
if(view==='month'){app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mon=+b.dataset.m;render()});app.querySelectorAll('[data-i]').forEach(r=>r.onclick=()=>go(+r.dataset.i))}
if(view==='search'){const inp=document.getElementById('q');inp.oninput=()=>{q=inp.value;runSearch()};runSearch();app.querySelectorAll('#res').forEach(r=>r.onclick=ev=>{const row=ev.target.closest('[data-i]');if(row)go(+row.dataset.i)})}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
function today(){const n=new Date();if(n.getFullYear()===2026)go(idx(n.getMonth()+1,n.getDate()));else{go(0);}}
let x0=null;document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(view!=='day'||x0===null)return;if(e.target.closest&&e.target.closest('input'))return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));x0=null});
const h=(location.hash||'').match(/^#d-(\d\d)-(\d\d)$/);if(h&&idx(+h[1],+h[2])>=0)cur=idx(+h[1],+h[2]);else{const n=new Date();if(n.getFullYear()===2026)cur=Math.max(0,idx(n.getMonth()+1,n.getDate()))}
mon=D[cur].m;render();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
</html>
